<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Таблица пользователей</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h2>Таблица пользователей</h2>

    <div class="controls">
        <input type="text" id="inputName" placeholder="Имя (минимум 3 символа)">
        <input type="text" id="inputJob" placeholder="Должность">
        <input type="text" id="inputNum" placeholder="Номер телефона">
        
        <button id="add">Добавить</button>
        <button id="delete">Удалить все</button>
    </div>

    <table id="userTable">
        <thead>
            <tr>
                <th>Имя</th>
                <th>Должность</th>
                <th>Номер</th>
                <th>Действия</th>
            </tr>
        </thead>
        <tbody id="tableBody">
        </tbody>
    </table>

    <script src="style.js"></script>
</body>
</html>
